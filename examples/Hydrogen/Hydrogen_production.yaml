# control connections
- from: ZZE1.soc
  to: controller.ZZE_soc
  time_shifted: True
- from: controller.ZZE_setpoint
  to: ZZE1.setpoint
  # time_shifted: True
- from: controller.Thermolyzer_setpoint
  to: thermolyzer1.desired_out

- from: CSVdayahead.price
  to: controller.DayAhead_price

monitor:
  file: './h2_system_example4_3.csv'
  items:

    - ZZE1.h2_out
    - ZZE1.soc
    - controller.ZZE_setpoint
    - controller.Thermolyzer_setpoint
    - thermolyzer1.h_gen
    - Joint1.out
    - CSVdayahead.price
