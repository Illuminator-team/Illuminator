# from biomass to thermolyzer
- from: CSVbiomass.biomass
  to: thermolyzer1.biomass_in

# from thermolyzer to joint
- from: thermolyzer1.h_gen
  to: Joint1.h2_in_1

### ZZE ELECTROLYZER ###
- from: ZZE1.h2_out
  to: Joint1.h2_in_2
###########################

# from joint to PSA
- from: Joint1.out
  to: PSA1.h2_in

# from PSA to small buffer
