scenario:
  name: "Hydrogen_system_4" # in mosaik so called world
  start_time: '2025-01-01 00:00:00' # ISO 8601 start time of the simulation
  end_time: '2025-02-01 00:00:00' # duration in seconds 
  time_resolution: 3600 # time step in seconds (optional). Defaults to 15 minutes (900 s)



models: 
- name: CSVdayahead
  type: CSV
  parameters:
    file_path: './data/dayahead.csv'
    delimiter: ','
    date_format: 'YYYY-MM-DD HH:mm:ss'

- name: CSVbiomass
  type: CSV
  parameters:
    file_path: './data/biomass3.csv'
    delimiter: ','
    date_format: 'YYYY-MM-DD HH:mm:ss'


### Hydrogen production system components ###
- name: thermolyzer1
  type: Thermolyzer
  parameters:
    eff: 90             # thermolyzer effficiency [%]  
    C_bio_h2 : 50       # conversion factor from biomass to hydrogen [kg/kg] 
    C_CO_2 : 20         # absorption factor carbondioxide per h2 produced [kg/kg] 
    C_Eelec_h2: 11.5    # conversion factor electrical energy to hydrogen mass [kWh/kg]    
    max_ramp_up : 200   # maximum ramp up in power per timestep [kW/timestep]  
    max_p_in : 8000    # maximum input power [kW]
  inputs:
    biomass_in : 0      # biomass input [kg/timestep]
    desired_out : 5   # desired output flow of hydrogen [kg/h]
  outputs:
    h_gen : 0           # hydrogen generation [kg]
    power_consumption : 0   # power consumption [kWh]
    CO2_out : 0         # CO2 output [kg]

- name: ZZE1
  type: ZZE
  parameters: 
    e_eff: 90       # electrolyzer effficiency [%]
    max_p_in: 500 # maximum charging power [kW]
    max_p_out: 100  # maximum output power [kW]
    h2_capacity_tot: 2000  # total hydrogen capacity [kg]
    h2_soc_min: 0
    h2_soc_max: 100
  inputs:
    setpoint: 2  # charge setpoint [kg/h]
  outputs:
    # electrolyzer part
    power_consumption: 0   # power_consumption power [kWh]
    # buffer part
    h2_out: 30
    overflow: 0
  states:
    soc: 0
    flag: 0
    available_h2: 0
    free_capacity: 0

- name: Joint1
  type: H2Joint
  parameters:
    joint_eff: 100             # joint efficiency [%]
  inputs:
    h2_in_1: 0               # input flow [kg/timestep]
    h2_in_2: 0               # input flow [kg/timestep]
  outputs:
    out: 0               # output flow [kg/timestep]

- name: PSA1
  type: H2PSA
  parameters:
    eff: 100             # PSA efficiency [%]
  inputs:
    h2_in: 0             # hydrogen input [kg/timestep]
  outputs:
    h2_out: 0            # hydrogen output [kg/timestep]


